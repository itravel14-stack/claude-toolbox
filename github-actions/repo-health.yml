# Cloud-side watchdog for ALL your repos. Runs on GitHub even when your PC is off.
# Install in a PRIVATE repo only (never this public toolbox — artifacts and issues would leak
# private repo names). Copy to <private-repo>/.github/workflows/repo-health.yml.
#
# Required secret (Settings → Secrets and variables → Actions):
#   AUDIT_TOKEN  fine-grained PAT, Resource owner = you, Repository access = All repositories,
#                permissions READ-ONLY: Contents, Metadata, Dependabot alerts, Secret scanning alerts.
# Optional secrets for an off-site encrypted mirror (skipped when absent):
#   BACKUP_PASSPHRASE   long random passphrase (also stored in your password manager)
#   RCLONE_CONFIG       contents of rclone.conf for your remote (e.g. Backblaze B2)
#   RCLONE_DEST         e.g. b2remote:my-dev-backups
name: repo-health
on:
  schedule: [{ cron: "23 11 * * *" }]   # daily 11:23 UTC
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Audit every repository
        id: audit
        env: { GH_TOKEN: "${{ secrets.AUDIT_TOKEN }}" }
        run: |
          set -uo pipefail
          owner="${{ github.repository_owner }}"
          gh api --paginate "user/repos?affiliation=owner&per_page=100" \
            --jq '.[] | [.full_name, .private, .archived, .size, .pushed_at] | @tsv' > repos.tsv
          [ -s repos.tsv ] || { echo "AUDIT_TOKEN cannot list repositories" > report.md; echo "problems=1" >> "$GITHUB_OUTPUT"; exit 0; }
          {
            echo "## Repo health $(date -u +%F)"; echo
            echo "| Repo | Private | Archived | Size MB | Last push | Clone | Dependabot | Secret alerts |"
            echo "|---|---|---|---|---|---|---|---|"
          } > report.md
          problems=0
          while IFS=$'\t' read -r r priv arch size pushed; do
            mb=$((size/1024))
            clone=ok; git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/$r.git" HEAD >/dev/null 2>&1 || { clone=FAIL; problems=$((problems+1)); }
            dep=$(gh api "repos/$r/dependabot/alerts?state=open&per_page=100" --jq length 2>/dev/null || echo "off")
            sec=$(gh api "repos/$r/secret-scanning/alerts?state=open&per_page=100" --jq length 2>/dev/null || echo "off")
            [[ "$dep" =~ ^[1-9] ]] && problems=$((problems+1))
            [[ "$sec" =~ ^[1-9] ]] && problems=$((problems+1))
            [[ "$priv" == false && "$r" != "$owner/claude-toolbox" ]] && { problems=$((problems+1)); priv="**PUBLIC**"; }
            (( mb >= 5000 )) && { problems=$((problems+1)); mb="**$mb**"; }
            echo "| $r | $priv | $arch | $mb | ${pushed%%T*} | $clone | $dep | $sec |" >> report.md
          done < repos.tsv
          echo "problems=$problems" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypted off-site mirror (optional)
        if: ${{ env.RCLONE_DEST != '' }}
        env:
          GH_TOKEN: "${{ secrets.AUDIT_TOKEN }}"
          PASS: "${{ secrets.BACKUP_PASSPHRASE }}"
          RCLONE_CONFIG_TEXT: "${{ secrets.RCLONE_CONFIG }}"
          RCLONE_DEST: "${{ secrets.RCLONE_DEST }}"
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone && printf '%s' "$RCLONE_CONFIG_TEXT" > ~/.config/rclone/rclone.conf
          day=$(date -u +%F); mkdir out
          cut -f1 repos.tsv | while read -r r; do
            f="out/${r//\//__}.bundle"
            git clone --quiet --mirror "https://x-access-token:${GH_TOKEN}@github.com/$r.git" m.git
            if [ -n "$(git -C m.git for-each-ref)" ]; then
              git -C m.git bundle create --quiet "../$f" --all && git bundle verify --quiet "$f" >/dev/null 2>&1
              gpg --batch --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "$f.gpg" "$f" && rm "$f"
            fi
            rm -rf m.git
          done
          rclone copy out "$RCLONE_DEST/actions/$day" && rclone check out "$RCLONE_DEST/actions/$day" --one-way
          echo "off-site: $(ls out | wc -l) encrypted bundles -> $RCLONE_DEST/actions/$day" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the attention issue
        if: ${{ steps.audit.outputs.problems != '0' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n=$(gh issue list -R "${{ github.repository }}" --label repo-health --state open --json number --jq '.[0].number')
          gh label create repo-health -R "${{ github.repository }}" --color B60205 2>/dev/null || true
          if [ -n "$n" ]; then gh issue comment "$n" -R "${{ github.repository }}" -F report.md
          else gh issue create -R "${{ github.repository }}" --label repo-health --title "Repo health: ${{ steps.audit.outputs.problems }} problem(s)" -F report.md; fi
env:
  RCLONE_DEST: "${{ secrets.RCLONE_DEST }}"
